<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Accès Super-Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a1a; font-family: 'Poppins', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; color: white; }
        .login-card { background: #2d2d2d; width: 100%; max-width: 400px; padding: 40px; border-radius: 15px; border: 1px solid #444; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .logo-icon { font-size: 3rem; margin-bottom: 20px; }
        .btn-super { background-color: #e63946; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 700; margin-top: 20px; transition: 0.3s; }
        .btn-super:hover { background-color: #d62828; transform: scale(1.02); }
        .form-control { background-color: #333; border: 1px solid #555; color: white; }
        .form-control:focus { background-color: #444; color: white; border-color: #e63946; box-shadow: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-icon">⚡</div>
        <h3 class="fw-bold mb-1">ZONE SUPER ADMIN</h3>
        <p class="text-muted small mb-4">Accès réservé à la direction générale</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}{% for category, message in messages %}
                <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
            {% endfor %}{% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3 text-start">
                <label class="small text-muted mb-1">Identifiant Maître</label>
                <input type="text" name="username" class="form-control" placeholder="SuperAdmin" required>
            </div>
            <div class="mb-3 text-start">
                <label class="small text-muted mb-1">Clé de sécurité</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-super">ENTRER</button>
        </form>
        <div class="mt-4">
            <a href="{{ url_for('login') }}" class="text-muted small text-decoration-none">← Retour espace standard</a>
        </div>
    </div>
</body>
</html>
