<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nouveau Dossier - MCAT</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
      :root {
        --primary-color: #003366;
        /* MODIFICATION ICI : Fond plus foncé pour le contraste */
        --secondary-bg: #dce1e9;
      }

      body {
        background-color: var(--secondary-bg);
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        padding-bottom: 50px;
        color: #344767;
      }

      /* --- NAVBAR --- */
      .navbar {
        background-color: var(--primary-color);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15); /* Ombre un peu plus marquée */
        padding: 15px 0;
      }
      .navbar-brand {
        font-weight: 700;
        letter-spacing: 1px;
        font-size: 1.2rem;
      }
      .nav-link {
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        padding: 10px 15px !important;
        border-radius: 8px;
        transition: all 0.3s;
        color: rgba(255, 255, 255, 0.8) !important;
      }
      .nav-link:hover {
        color: white !important;
        background-color: rgba(255, 255, 255, 0.1);
        transform: translateY(-2px);
      }

      /* --- STYLE DU FORMULAIRE --- */
      .card-form {
        border: none;
        border-radius: 16px;
        background: white;
        /* MODIFICATION ICI : Ombre plus visible (0.1 au lieu de 0.05) */
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        /* Petit bord subtil pour bien définir les contours */
        border: 1px solid rgba(255, 255, 255, 0.5);
        overflow: hidden;
      }

      .form-header {
        background-color: white;
        padding: 20px 40px;
        border-bottom: 1px solid #e0e6ed; /* Ligne de séparation visible */
      }

      .section-label {
        color: var(--primary-color);
        font-size: 0.85rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
      }
      .section-label i {
        margin-right: 10px;
        font-size: 1.1rem;
      }

      .form-label {
        font-size: 0.85rem;
        font-weight: 600;
        color: #555;
        margin-bottom: 8px;
      }

      .form-control,
      .form-select {
        border-radius: 10px;
        padding: 12px 15px;
        border: 1px solid #d1d9e6; /* Bordure des champs un peu plus visible */
        background-color: #fff;
        font-size: 0.95rem;
        transition: all 0.3s;
      }
      .form-control:focus,
      .form-select:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 4px rgba(0, 51, 102, 0.1);
        background-color: white;
      }

      .btn-submit {
        background-color: var(--primary-color);
        color: white;
        border-radius: 50px;
        padding: 12px 30px;
        font-weight: 600;
        letter-spacing: 0.5px;
        border: none;
        transition: all 0.3s;
      }
      .btn-submit:hover {
        background-color: #002244;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 51, 102, 0.3);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
      <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center" href="{{ url_for('main.tableau_de_bord') }}">
          <span style="font-size: 1.5rem; margin-right: 10px">🏛️</span>
          <div style="line-height: 1">
            <div>MCAT</div>
            <div style="font-size: 0.7rem; font-weight: 400; opacity: 0.7">PORTAIL ADMIN</div>
          </div>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('main.tableau_de_bord') }}">AGRÉMENTS</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('main.liste_cotations') }}">COTATIONS</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">DRPS</a>
            </li>
          </ul>
        </div>

        <div class="d-flex align-items-center">
          <a href="{{ url_for('main.logout') }}" class="btn btn-outline-light btn-sm rounded-pill px-3"> Déconnexion </a>
        </div>
      </div>
    </nav>

    <div class="container mt-4 mb-5">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="mb-3">
            <a href="{{ url_for('main.tableau_de_bord') }}" class="text-decoration-none text-muted small fw-bold">
              &larr; Retour au tableau de bord
            </a>
          </div>

          <div class="card card-form">
            <div class="form-header d-flex justify-content-between align-items-center">
              <div>
                <h4 class="fw-bold text-dark mb-0">Nouveau Dossier</h4>
                <p class="text-muted small mb-0">Enregistrement d'un candidat à l'agrément</p>
              </div>
              <div style="font-size: 2rem; opacity: 0.1">📝</div>
            </div>

            <div class="card-body p-4 p-md-5">
              <form action="{{ url_for('main.sauvegarder') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

                <div class="section-label">
                  <span>🏢 Identité de l'Entreprise</span>
                </div>

                <div class="row g-4 mb-4">
                  <div class="col-12">
                    <label class="form-label">Dénomination Sociale (Nom Entreprise) <span class="text-danger">*</span></label>
                    <input
                      type="text"
                      class="form-control form-control-lg fw-bold"
                      name="nom_entreprise"
                      placeholder="Ex: SENEGAL SERVICES SARL"
                      required
                    />
                  </div>

                  <div class="col-md-8">
                    <label class="form-label">Adresse du Siège Social</label>
                    <input type="text" class="form-control" name="adresse" placeholder="Ex: Lot 45, Cité Keur Gorgui" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Ville / Localité</label>
                    <input type="text" class="form-control" name="ville" placeholder="Ex: Dakar" value="Dakar" />
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">Numéro NINEA</label>
                    <input type="text" class="form-control" name="ninea" placeholder="Ex: 001234567" />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Secteur d'activité</label>
                    <input type="text" class="form-control" name="position" placeholder="Ex: BTP, Informatique..." />
                  </div>
                </div>

                <hr class="my-5" style="border-top: 1px dashed #b0b8c4" />

                <div class="section-label">
                  <span>👤 Représentant & Contact</span>
                </div>

                <div class="row g-4 mb-4">
                  <div class="col-md-8">
                    <label class="form-label">Nom complet du Responsable</label>
                    <input type="text" class="form-control" name="nom_proprietaire" placeholder="Ex: Monsieur Moussa Diop" />
                  </div>
                  <div class="col-md-4">
                    <label class="form-label">Civilité</label>
                    <select class="form-select" name="genre">
                      <option value="Homme">Monsieur</option>
                      <option value="Femme">Madame</option>
                    </select>
                  </div>

                  <div class="col-md-6">
                    <label class="form-label">Email Officiel <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" name="email" placeholder="contact@entreprise.sn" required />
                    <div class="form-text small">L'agrément sera envoyé à cette adresse.</div>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Téléphone</label>
                    <input type="text" class="form-control" name="telephone" placeholder="Ex: 77 000 00 00" />
                  </div>
                </div>

                <div class="d-flex justify-content-end gap-3 mt-5">
                  <a href="{{ url_for('main.tableau_de_bord') }}" class="btn btn-light px-4 py-2 rounded-pill fw-bold text-muted border">Annuler</a>
                  <button type="submit" class="btn btn-submit shadow">Enregistrer le Dossier</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
